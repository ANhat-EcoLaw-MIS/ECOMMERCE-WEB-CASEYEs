<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; font: 12px Inter, sans-serif; color: #1a1b23; background: #fafafa; }
      h1 { margin: 0 0 8px; font-size: 17px; color: #2a1d4d; }
      p { margin: 0 0 16px; line-height: 1.55; color: #625b6d; }
      button { width: 100%; border: 0; border-radius: 999px; padding: 12px 16px; color: white; background: #433075; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { margin-top: 12px; min-height: 18px; color: #6a53b0; }
    </style>
  </head>
  <body>
    <h1>CasEYE's UI Kit</h1>
    <p>Generate editable foundations, reusable components, production screens, mobile layouts, and key states.</p>
    <button id="generate">Generate production UI kit</button>
    <div id="status" role="status"></div>
    <script>
      const button = document.getElementById('generate');
      const status = document.getElementById('status');
      button.onclick = () => {
        button.disabled = true;
        status.textContent = 'Generating 5 pages…';
        parent.postMessage({ pluginMessage: { type: 'generate' } }, '*');
      };
      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message?.type === 'done') {
          status.textContent = message.text;
          button.disabled = false;
        }
        if (message?.type === 'error') {
          status.textContent = message.text;
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
