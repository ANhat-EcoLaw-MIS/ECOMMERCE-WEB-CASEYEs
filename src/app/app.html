<!-- Top progress bar while a route (lazy chunk + guards) loads. -->
<app-route-progress />
<router-outlet />

<!-- Global notifications: top-left, newest on top, above the header and dialogs. -->
<div class="pointer-events-none fixed left-4 top-4 z-[1000] flex flex-col-reverse gap-2 sm:left-5 sm:top-5" aria-label="Thông báo">
  @for (notification of notificationManager.notifications(); track notification.id) {
    <app-notification
      [payload]="notification"
      (actionClicked)="notificationManager.triggerAction($event)"
      (dismissed)="notificationManager.remove($event)" />
  }
</div>
<app-auth-dialog/>
<!-- Global blocking loading pop-up (LoadingOverlay service). -->
<app-loading-host />
<app-toast-list />
