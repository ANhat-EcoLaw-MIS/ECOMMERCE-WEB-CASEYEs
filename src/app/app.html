<a
  href="#main"
  class="sr-only rounded-pill bg-brand-400 px-4 py-2 font-semibold text-ink focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60]"
>
  Bỏ qua điều hướng
</a>

<app-header [cartCount]="cartCount()" (searchRequested)="onSearchRequested()" />

<main id="main">
  <router-outlet />
</main>

<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-4 pointer-events-none">
  @for (notification of notificationManager.notifications(); track notification.id) {
    <app-notification
      [payload]="notification"
      (actionClicked)="notificationManager.triggerAction($event)"
      (dismissed)="notificationManager.remove($event)" />
  }
</div>
<app-auth-dialog/>
<app-footer></app-footer>
