<div class="p-3 bg-brand-100 m-5">
  <p>DEMO ONE: TESTING DATABASE QUERIES</p>
  <input class="border-2 m-3" #newTitle placeholder="New title" />
  <button (click)="add(newTitle.value); newTitle.value = ''">Add</button>

  @if (error()) { <p class="error">{{ error() }}</p> }

  <ul>
    @for (item of items(); track item.id) {
      <li>
        <span class="p-2">{{ item.title }}</span>
        <button class="border-2 border-b-brand-200" (click)="rename(item)">Rename</button>
        <button class="border-2 border-b-brand-200" (click)="remove(item.id)">Delete</button>
      </li>
    } @empty {
      <li>Nothing yet</li>
    }
  </ul>
</div>
