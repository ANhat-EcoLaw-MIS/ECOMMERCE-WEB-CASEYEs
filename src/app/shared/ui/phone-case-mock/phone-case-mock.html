<div
  class="relative aspect-9/19 w-full overflow-hidden rounded-[2.25rem] shadow-lift ring-1 ring-white/25"
  [class]="toneClass()"
>
  @if (imageSrc(); as src) {
    <img [ngSrc]="src" [alt]="alt()" [priority]="priority()" fill class="object-cover" />
  } @else {
    <!-- CSS-drawn artwork: soft clouds + caption -->
    <div aria-hidden="true" class="absolute inset-0">
      <div class="absolute -left-4 top-1/3 h-20 w-3/4 rounded-full bg-white/50 blur-xl"></div>
      <div class="absolute -right-6 top-1/2 h-24 w-2/3 rounded-full bg-white/40 blur-xl"></div>
      <div class="absolute bottom-6 left-1/4 h-16 w-3/4 rounded-full bg-white/60 blur-lg"></div>
    </div>

    @if (caption()) {
      <p class="absolute inset-x-0 top-[40%] -rotate-12 text-center font-display text-2xl font-extrabold tracking-tight">
        {{ caption() }}
      </p>
    }
  }

  <!-- Camera bump -->
  <div aria-hidden="true" class="absolute left-[8%] top-[3.5%] grid w-[38%] aspect-square grid-cols-2 gap-[8%] rounded-[28%] bg-white/25 p-[8%] backdrop-blur-sm">
    <span class="aspect-square rounded-full bg-ink ring-1 ring-white/30"></span>
    <span class="aspect-square rounded-full bg-ink ring-1 ring-white/30"></span>
    <span class="aspect-square rounded-full bg-ink ring-1 ring-white/30"></span>
  </div>
</div>
