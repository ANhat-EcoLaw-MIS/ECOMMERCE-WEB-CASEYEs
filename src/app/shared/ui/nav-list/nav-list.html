<nav aria-label="Main Navigation">
  <ul [class]="listClasses()">
    <!-- @for block replaces *ngFor in modern Angular -->
    @for (item of items(); track item.label) {
      <li>
        <a
          [routerLink]="item.href"
          class="flex items-center min-h-[44px] px-2 font-body font-medium text-ink-soft hover:text-brand-800 transition-colors duration-200 rounded-md hover:bg-brand-50"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
