@if (model().has3dModel && model().model3dUrl) {
  <!--
    Column: model stage (fills the space) + controls row underneath, so controls never cover the phone.
    The model-viewer is absolutely positioned in the stage so it always has a real height.
  -->
  <div class="flex h-full min-h-[360px] w-full flex-col">
  <div class="relative min-h-0 flex-1">
    <model-viewer
      class="absolute inset-x-0 bottom-0 top-12 transition-opacity duration-500 motion-reduce:transition-none sm:top-14"
      [class.opacity-0]="!printed()"
      #mv
      [attr.src]="model().model3dUrl"
      [attr.alt]="'Mô hình 3D ốp lưng ' + model().name"
      camera-controls
      auto-rotate
      auto-rotate-delay="2500"
      camera-orbit="0deg 80deg 118%"
      min-camera-orbit="auto auto 100%"
      max-camera-orbit="auto auto 300%"
      tone-mapping="neutral"
      shadow-intensity="1.1"
      shadow-softness="0.8"
      exposure="0.8"
      touch-action="pan-y"
      interaction-prompt="none"
      (load)="onLoad()"
      (progress)="onProgress($event)"
      (model-visibility)="onVisible()"
      style="width: 100%; height: 100%; outline: none; background: transparent; --poster-color: transparent;"
    ></model-viewer>

    @switch (phase()) {
      <!-- 1. Downloading the .glb: show the 2D case (blurred) so there is something real to look at. -->
      @case ('download') {
        <div class="pointer-events-none absolute inset-0 grid place-items-center">
          <app-case-preview
            class="w-[min(34%,180px)] opacity-60 blur-[2px]"
            [model]="model()"
            [artworkUrl]="artworkUrl()"
            [colorHex]="colorHex()"
            [caseType]="caseType()"
            [seed]="seed()"
            [alt]="''"
            aria-hidden="true"
          />
          <div class="absolute flex w-56 flex-col items-center gap-2.5 rounded-2xl bg-white/90 px-4 py-3.5 shadow-soft backdrop-blur">
            <span class="flex w-full items-center justify-between text-xs font-semibold text-brand-800">
              Đang tải mô hình 3D
              <span class="tabular-nums text-ink-soft">{{ (downloaded() * 100).toFixed(0) }}%</span>
            </span>
            <app-loading class="w-full" variant="bar" [value]="downloaded() || null" label="Đang tải mô hình 3D" />
          </div>
        </div>
      }
      <!-- 2. First print of the design onto the model. -->
      @case ('print') {
        <div class="pointer-events-none absolute inset-0 grid place-items-center">
          <span class="flex items-center gap-2 rounded-pill bg-white/90 py-1.5 pl-2 pr-3 shadow-soft backdrop-blur">
            <app-loading variant="spinner" size="sm" [delay]="0" label="Đang in họa tiết lên ốp…" />
          </span>
        </div>
      }
      <!-- 3. Re-printing after a colour/design change: small, non-blocking corner hint. -->
      @case ('reprint') {
        <span class="pointer-events-none absolute right-3 top-14 flex items-center rounded-pill bg-white/85 px-2 py-1 shadow-soft backdrop-blur">
          <app-loading variant="spinner" size="sm" [delay]="200" label="Đang cập nhật" />
        </span>
      }
    }

  </div>
    <div class="flex shrink-0 items-center justify-center gap-2 px-3 pb-3 pt-2">
      <span class="hidden whitespace-nowrap rounded-pill bg-white/85 px-3 py-1.5 text-xs text-ink-soft backdrop-blur min-[420px]:inline">Kéo để xoay 360°</span>
      <button
        type="button"
        (click)="resetView()"
        class="inline-flex min-h-10 items-center gap-1.5 whitespace-nowrap rounded-pill bg-white/85 px-3 text-xs font-semibold text-brand-800 backdrop-blur hover:bg-white focus-visible:outline-2 focus-visible:outline-brand-400"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
        Đặt lại góc nhìn
      </button>
    </div>
  </div>
} @else {
  <div class="flex h-full min-h-[360px] flex-col items-center justify-center gap-4 p-6">
    <app-case-preview
      class="w-[min(46%,220px)]"
      [model]="model()"
      [artworkUrl]="artworkUrl()"
      [colorHex]="colorHex()"
      [caseType]="caseType()"
      [seed]="seed()"
    />
    <p class="rounded-pill bg-white/85 px-3 py-1.5 text-center text-xs text-ink-soft">
      3D cho {{ model().name }} sắp có. Đang hiển thị bản 2D.
    </p>
  </div>
}
