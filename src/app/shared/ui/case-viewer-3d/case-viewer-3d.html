@if (model().has3dModel && model().model3dUrl) {
  <!-- The viewer is absolutely positioned so it always has a real height (height:100% of an auto box is 0). -->
  <div class="relative h-full min-h-[360px] w-full">
    <model-viewer
      class="absolute inset-x-0 bottom-12 top-14"
      #mv
      [attr.src]="model().model3dUrl"
      [attr.alt]="'Mô hình 3D ốp lưng ' + model().name"
      camera-controls
      auto-rotate
      auto-rotate-delay="2500"
      camera-orbit="0deg 80deg auto"
      tone-mapping="neutral"
      shadow-intensity="1.1"
      shadow-softness="0.8"
      exposure="0.8"
      touch-action="pan-y"
      interaction-prompt="none"
      (load)="onLoad()"
      (model-visibility)="onVisible()"
      style="width: 100%; height: 100%; outline: none; background: transparent; --poster-color: transparent;"
    ></model-viewer>

    @if (syncing()) {
      <div class="pointer-events-none absolute inset-0 grid place-items-center" role="status">
        <span class="rounded-pill bg-white/90 px-3 py-1.5 text-xs font-semibold text-brand-800 shadow-soft">Đang tải mô hình 3D…</span>
      </div>
    }

    <div class="absolute bottom-3 left-1/2 flex -translate-x-1/2 items-center gap-2">
      <span class="rounded-pill bg-white/85 px-3 py-1.5 text-xs text-ink-soft backdrop-blur">Kéo để xoay 360°</span>
      <button
        type="button"
        (click)="resetView()"
        class="min-h-9 rounded-pill bg-white/85 px-3 text-xs font-semibold text-brand-800 backdrop-blur hover:bg-white focus-visible:outline-2 focus-visible:outline-brand-400"
      >
        Đặt lại góc nhìn
      </button>
    </div>
  </div>
} @else {
  <div class="flex h-full min-h-[360px] flex-col items-center justify-center gap-4 p-6">
    <app-case-preview
      class="w-[min(46%,220px)]"
      [model]="model()"
      [artworkUrl]="artworkUrl()"
      [colorHex]="colorHex()"
      [caseType]="caseType()"
      [seed]="seed()"
    />
    <p class="rounded-pill bg-white/85 px-3 py-1.5 text-center text-xs text-ink-soft">
      3D cho {{ model().name }} sắp có. Đang hiển thị bản 2D.
    </p>
  </div>
}
