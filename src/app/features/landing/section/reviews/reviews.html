<section class="reviews relative isolate overflow-hidden py-16 text-white lg:py-24" aria-labelledby="reviews-title">
  <div class="aurora" aria-hidden="true"></div>

  <div class="mx-auto max-w-[1440px] px-4 lg:px-10">
    <div appReveal class="flex flex-wrap items-end justify-between gap-8">
      <div class="max-w-2xl">
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-brand-200">Khách hàng nói gì</p>
        <h2 id="reviews-title" class="mt-3 font-display text-[clamp(2rem,4vw,3.25rem)] font-extrabold leading-[1.05] tracking-[-0.02em]">
          Hơn <span class="bg-linear-90 from-brand-200 via-[#f9a8d4] to-[#fde68a] bg-clip-text text-transparent">10.000 chiếc ốp</span><br class="hidden sm:block" />
          đã tìm được chủ nhân
        </h2>
      </div>

      <div class="glass flex items-center gap-4 rounded-3xl px-5 py-4">
        <span class="font-display text-5xl font-extrabold">4.9</span>
        <span>
          <span class="flex text-[#fbbf24]" aria-label="4.9 trên 5 sao">
            @for (s of stars(4.9); track $index) {
              <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" [attr.fill]="s ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.5"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z" /></svg>
            }
          </span>
          <span class="mt-1 block text-xs text-white/70">từ 2.300+ đánh giá đã xác thực</span>
        </span>
      </div>
    </div>

    <ul class="mt-12 grid gap-5 md:grid-cols-3 lg:gap-6">
      @for (r of reviews; track r.name; let i = $index) {
        <li appReveal [revealDelay]="i * 120" class="h-full" [class]="i === 1 ? 'md:translate-y-8' : ''">
          <figure class="review glass group flex h-full flex-col gap-5 rounded-[28px] p-6 lg:p-7">
            <div class="flex items-center justify-between">
              <span class="flex text-[#fbbf24]" [attr.aria-label]="r.rating + ' trên 5 sao'">
                @for (s of stars(r.rating); track $index) {
                  <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" [attr.fill]="s ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.5"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z" /></svg>
                }
              </span>
              <span class="quote-mark" aria-hidden="true">“</span>
            </div>

            <blockquote class="flex-1 text-[15px] leading-relaxed text-white/90">{{ r.quote }}</blockquote>

            @if (r.design; as d) {
              <a
                [routerLink]="['/shop', d.id]"
                [queryParams]="{ model: r.device.id }"
                class="flex items-center gap-3 rounded-2xl bg-white/8 p-2.5 pr-4 ring-1 ring-white/10 transition-colors hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-brand-400"
              >
                <span class="grid h-14 w-11 shrink-0 place-items-center rounded-xl bg-white/10">
                  <app-case-preview class="w-7" [model]="r.device" [artworkUrl]="artworkUrl(d.id)" [seed]="d.id" colorHex="#0A0A0A" caseType="snap" [alt]="''" aria-hidden="true" />
                </span>
                <span class="min-w-0 text-sm">
                  <span class="block truncate font-semibold">{{ d.name }}</span>
                  <span class="block text-xs text-white/60">{{ r.device.name }}</span>
                </span>
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="ml-auto size-4 shrink-0 text-white/60 transition-transform group-hover:translate-x-0.5"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              </a>
            }

            <figcaption class="flex items-center gap-3 border-t border-white/10 pt-4">
              <span class="grid size-11 shrink-0 place-items-center rounded-full text-sm font-bold text-white shadow-soft" [style.background]="r.avatar">{{ r.initials }}</span>
              <span class="min-w-0">
                <span class="flex items-center gap-1.5 font-semibold">
                  {{ r.name }}
                  <svg aria-label="Đã mua hàng" viewBox="0 0 24 24" fill="currentColor" class="size-4 text-[#34d399]"><path d="M12 2 14.4 4.4 17.8 4l.6 3.4L21.4 9 20 12l1.4 3-3 1.6-.6 3.4-3.4-.4L12 22l-2.4-2.4-3.4.4-.6-3.4-3-1.6L4 12 2.6 9l3-1.6L6.2 4l3.4.4Z" /><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#0f0a1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </span>
                <span class="block text-xs text-white/60">{{ r.city }} · {{ r.date }}</span>
              </span>
            </figcaption>
          </figure>
        </li>
      }
    </ul>
  </div>
</section>
