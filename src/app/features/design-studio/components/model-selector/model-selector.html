<div class="relative">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-2.5 rounded-pill border border-line bg-surface-alt px-4 py-2 text-sm font-medium text-ink shadow-soft transition-all hover:border-brand-400 hover:shadow-glow focus:outline-none focus:ring-2 focus:ring-brand-400"
    [attr.aria-expanded]="isOpen()"
  >
    <span class="flex h-2.5 w-2.5 rounded-full bg-brand-600 animate-pulse"></span>
    <span class="text-ink-soft">Dòng máy:</span>
    <strong class="font-display font-semibold text-brand-900">
      {{ state.selectedModel().name }}
    </strong>
    <svg
      class="h-4 w-4 text-ink-soft transition-transform"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown / Popover -->
  @if (isOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/20 backdrop-blur-xs sm:hidden"
      (click)="closeDropdown()"
    ></div>

    <div
      class="absolute right-0 top-full z-50 mt-2 w-80 max-w-[90vw] rounded-card border border-line bg-surface-alt p-4 shadow-lift backdrop-blur-xl"
    >
      <div class="mb-3 flex items-center justify-between border-b border-line pb-2">
        <h4 class="font-display text-sm font-bold text-ink">Chọn dòng điện thoại</h4>
        <button
          type="button"
          (click)="closeDropdown()"
          class="text-xs text-ink-soft hover:text-ink"
        >
          Đóng
        </button>
      </div>

      <!-- Models Grouped by Brand -->
      <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
        @for (brand of state.allBrands(); track brand.id) {
          <div>
            <div class="mb-1 text-[11px] font-bold uppercase tracking-wider text-brand-600">
              {{ brand.name }}
            </div>
            <div class="grid grid-cols-1 gap-1">
              @for (model of state.allModels(); track model.id) {
                @if (model.brandId === brand.id) {
                  <button
                    type="button"
                    (click)="onSelectModel(model.id)"
                    class="flex items-center justify-between rounded-lg px-3 py-2 text-left text-sm transition-colors"
                    [class]="
                      state.selectedModel().id === model.id
                        ? 'bg-brand-100 font-bold text-brand-800'
                        : 'text-ink hover:bg-brand-50'
                    "
                  >
                    <span>{{ model.name }}</span>
                    @if (state.selectedModel().id === model.id) {
                      <span class="text-xs text-brand-800">✓ Đang chọn</span>
                    }
                  </button>
                }
              }
            </div>
          </div>
        }
      </div>

      <!-- Color / Finish Selector for active model -->
      <div class="mt-4 border-t border-line pt-3">
        <div class="mb-2 text-xs font-semibold text-ink-soft">Màu phôi ốp:</div>
        <div class="flex flex-wrap gap-2">
          @for (sku of state.selectedModel().skus; track sku.skuId) {
            <button
              type="button"
              (click)="onSelectSku(sku.skuId)"
              class="relative flex h-8 w-8 items-center justify-center rounded-full border-2 transition-transform hover:scale-110"
              [class]="
                state.selectedSku().skuId === sku.skuId
                  ? 'border-brand-800 ring-2 ring-brand-400'
                  : 'border-line'
              "
              [style.backgroundColor]="sku.colorHex"
              [title]="sku.colorName"
            >
              @if (state.selectedSku().skuId === sku.skuId) {
                <span
                  class="h-2 w-2 rounded-full"
                  [class]="sku.colorHex === '#FFFFFF' ? 'bg-ink' : 'bg-white'"
                ></span>
              }
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
