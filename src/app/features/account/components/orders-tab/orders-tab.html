<section class="rounded-card border border-line bg-surface-alt p-6 shadow-soft sm:p-8">
  <div class="mb-6 border-b border-line pb-6">
    <h2 class="font-display text-xl font-bold text-ink sm:text-2xl">Lịch sử mua hàng</h2>
    <p class="mt-1 text-sm text-ink-soft">Theo dõi trạng thái các đơn hàng CasEYE's của bạn.</p>
  </div>
  <div class="space-y-4">
    @for (order of orders; track order.id) {
      <article class="rounded-xl border border-line bg-surface p-4 transition-colors hover:border-brand-200 sm:p-5">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-line pb-3">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-brand-800">#{{ order.id }}</span>
            <span class="text-xs text-ink-soft">• Đặt ngày {{ order.date }}</span>
          </div>
          <span class="rounded-pill bg-brand-100 px-3 py-1 text-xs font-semibold text-brand-800">{{ order.status }}</span>
        </div>
        <div class="flex flex-col items-start justify-between gap-4 py-4 sm:flex-row sm:items-center">
          <div class="flex items-center gap-3">
            <div class="flex size-14 shrink-0 items-center justify-center rounded-lg bg-brand-100 text-xs font-bold text-brand-800">CASE</div>
            <div>
              <p class="text-sm font-bold text-ink">{{ order.item }} ({{ order.device }})</p>
              <p class="text-xs text-ink-soft">Chất liệu: Chống sốc viền nhôm • In UV nổi 3D</p>
            </div>
          </div>
          <p class="text-sm font-bold text-brand-800">{{ order.total }}</p>
        </div>
        <div class="flex justify-end border-t border-line pt-3">
          <button class="min-h-[44px] rounded-pill bg-brand-800 px-4 py-2 text-xs font-semibold text-white hover:bg-brand-600 focus-visible:outline-2 focus-visible:outline-brand-400" type="button">Chi tiết đơn hàng</button>
        </div>
      </article>
    }
  </div>
</section>
