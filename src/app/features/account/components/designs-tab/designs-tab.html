<section class="rounded-card border border-line bg-surface-alt p-6 shadow-soft sm:p-8">
  <div class="mb-6 flex flex-col gap-3 border-b border-line pb-6 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="font-display text-xl font-bold text-ink sm:text-2xl">Bộ sưu tập ốp đã thiết kế ({{ designs.length }})</h2>
      <p class="mt-1 text-sm text-ink-soft">Các bản vẽ và mock-up 3D được lưu từ CasEYE's Design Studio.</p>
    </div>
    <a class="flex min-h-[44px] items-center justify-center rounded-pill bg-brand-800 px-5 py-2.5 text-sm font-semibold text-white shadow-soft hover:bg-brand-600 focus-visible:outline-2 focus-visible:outline-brand-400" href="/design-studio">Tạo ốp mới</a>
  </div>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (design of designs; track design.id) {
      <article class="group rounded-card border border-line bg-surface p-4 transition-all hover:-translate-y-1 hover:shadow-lift">
        <div class="relative mb-3 flex aspect-[3/4] items-center justify-center overflow-hidden rounded-xl bg-gradient-to-br from-brand-900 to-brand-800">
          <div class="flex h-52 w-28 -rotate-3 flex-col items-center justify-center rounded-2xl border-2 border-white/30 bg-white/10 p-2 text-center text-white shadow-soft transition-transform group-hover:rotate-0">
            <span class="text-[10px] uppercase tracking-widest opacity-75">CasEYE's</span>
            <p class="mt-2 bg-gradient-to-r from-brand-200 to-brand-400 bg-clip-text font-display text-xs font-bold text-transparent">{{ design.name }}</p>
          </div>
          <span class="absolute right-2.5 top-2.5 rounded-pill bg-brand-800 px-2 py-0.5 text-[10px] font-bold text-white">{{ design.device }}</span>
        </div>
        <h3 class="text-sm font-bold text-ink group-hover:text-brand-800">{{ design.name }}</h3>
        <p class="mt-0.5 text-xs text-ink-soft">{{ design.updated }}</p>
        <div class="mt-3 flex items-center justify-between border-t border-line pt-3">
          <span class="text-xs font-bold text-brand-800">{{ design.price }}</span>
          <button class="min-h-[44px] rounded-pill bg-brand-100 px-3 text-xs font-semibold text-brand-800 hover:bg-brand-200 focus-visible:outline-2 focus-visible:outline-brand-400" type="button">Đặt in</button>
        </div>
      </article>
    }
  </div>
</section>
