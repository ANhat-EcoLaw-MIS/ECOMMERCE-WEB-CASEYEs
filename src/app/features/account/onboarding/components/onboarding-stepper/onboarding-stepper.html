<section aria-label="Tiến trình thiết lập" class="space-y-5">
  <div class="flex items-center justify-between gap-4">
    <div>
      <div class="mb-2 inline-flex items-center gap-2 text-xs font-semibold text-brand-200">
        <span aria-hidden="true" class="text-base">✦</span>
        Thiết lập phong cách cá nhân
      </div>
      <h2 class="font-display text-xl font-extrabold tracking-tight text-white md:text-2xl">
        Tùy biến Studio của riêng bạn
      </h2>
    </div>
    <div aria-label="Tiến trình" class="flex shrink-0 items-center gap-2">
      @for (item of steps; track item.step) {
        <span
          [attr.aria-label]="'Bước ' + item.step"
          [class]="currentStep() === item.step
            ? 'size-2.5 rounded-full bg-brand-400'
            : currentStep() > item.step
              ? 'size-2.5 rounded-full bg-brand-200'
              : 'size-2.5 rounded-full bg-white/25'"
        ></span>
      }
    </div>
  </div>

  <nav aria-label="Các bước thiết lập" class="grid grid-cols-3 gap-2 rounded-2xl border border-white/10 bg-onboarding-deep/80 p-1.5">
    @for (item of steps; track item.step) {
      <button
        type="button"
        [attr.aria-current]="currentStep() === item.step ? 'step' : null"
        [disabled]="disabled()"
        [class]="currentStep() === item.step
          ? 'flex min-h-11 items-center justify-center gap-2 rounded-xl bg-white px-2 py-2.5 font-display text-xs font-bold text-brand-800 shadow-sm transition'
          : 'flex min-h-11 items-center justify-center gap-2 rounded-xl px-2 py-2.5 font-display text-xs font-medium text-white/70 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-50'"
        (click)="select(item.step)"
      >
        <span
          [class]="currentStep() === item.step
            ? 'grid size-5 shrink-0 place-items-center rounded-full bg-brand-800 text-[10px] text-white'
            : 'grid size-5 shrink-0 place-items-center rounded-full bg-white/15 text-[10px] text-white/80'"
        >
          {{ item.step }}
        </span>
        <span class="truncate">{{ item.label }}</span>
      </button>
    }
  </nav>
</section>
