<dialog
  #dialog
  aria-labelledby="skip-dialog-title"
  aria-describedby="skip-dialog-description"
  class="w-[min(100%-2rem,30rem)] rounded-3xl border border-purple-300/30 bg-onboarding-panel p-0 text-white shadow-2xl backdrop:bg-onboarding-deep/80"
>
  <div class="space-y-5 p-6 sm:p-8">
    <div>
      <h2 id="skip-dialog-title" class="font-display text-xl font-extrabold">Bỏ qua thiết lập?</h2>
      <p id="skip-dialog-description" class="mt-3 text-sm leading-relaxed text-white/75">
        Bạn có muốn bỏ qua bước tùy chỉnh nhanh này? Bạn luôn có thể đổi dòng máy &amp; phong cách bất kỳ lúc nào trong Studio 3D.
      </p>
    </div>
    <div class="flex justify-end gap-3">
      <button
        type="button"
        class="rounded-full border border-purple-300/30 px-4 py-2.5 text-xs font-semibold text-white/80 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="busy()"
        (click)="stay()"
      >
        Ở lại
      </button>
      <button
        type="button"
        class="rounded-full bg-gradient-to-r from-brand-600 to-brand-400 px-5 py-2.5 text-xs font-bold text-white shadow-glow transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="busy()"
        (click)="skip()"
      >
        Bỏ qua
      </button>
    </div>
  </div>
</dialog>
