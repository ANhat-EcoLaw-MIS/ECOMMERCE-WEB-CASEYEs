<section aria-labelledby="device-heading" class="space-y-5">
  <div class="flex items-start justify-between gap-4">
    <div>
      <span class="text-[11px] font-bold uppercase tracking-wider text-brand-200">Bước 2 / 3</span>
      <h3 id="device-heading" data-step-heading tabindex="-1" class="mt-1 font-display text-lg font-bold text-white focus:outline-none">
        Dòng máy bạn đang sử dụng là gì?
      </h3>
      <p class="mt-1 text-xs leading-relaxed text-white/70">
        Khuôn ốp được thiết kế chính xác theo viền camera và các nút bấm.
      </p>
    </div>
    <span class="shrink-0 rounded-full border border-purple-300/30 bg-purple-900/40 px-2.5 py-1 text-xs font-bold text-brand-200">
      {{ selectedDevice() ? 'Đã chọn' : 'Tùy chọn' }}
    </span>
  </div>

  <div aria-label="Thương hiệu thiết bị" class="flex w-fit max-w-full flex-wrap items-center gap-1 rounded-2xl border border-purple-300/20 bg-onboarding-deep/90 p-1">
    <button
      type="button"
      [attr.aria-pressed]="brand() === 'apple'"
      [disabled]="busy()"
      class="rounded-xl px-4 py-2 text-xs font-medium transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
      [class.bg-white]="brand() === 'apple'"
      [class.font-bold]="brand() === 'apple'"
      [class.text-brand-800]="brand() === 'apple'"
      [class.shadow-sm]="brand() === 'apple'"
      [class.text-white]="brand() !== 'apple'"
      [class.opacity-70]="brand() !== 'apple'"
      (click)="selectBrand('apple')"
    >
      Apple
    </button>
    <button
      type="button"
      [attr.aria-pressed]="brand() === 'samsung'"
      [disabled]="busy()"
      class="rounded-xl px-4 py-2 text-xs font-medium transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
      [class.bg-white]="brand() === 'samsung'"
      [class.font-bold]="brand() === 'samsung'"
      [class.text-brand-800]="brand() === 'samsung'"
      [class.shadow-sm]="brand() === 'samsung'"
      [class.text-white]="brand() !== 'samsung'"
      [class.opacity-70]="brand() !== 'samsung'"
      (click)="selectBrand('samsung')"
    >
      Samsung
    </button>
    <button
      type="button"
      [attr.aria-pressed]="brand() === 'xiaomi'"
      [disabled]="busy()"
      class="rounded-xl px-4 py-2 text-xs font-medium transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
      [class.bg-white]="brand() === 'xiaomi'"
      [class.font-bold]="brand() === 'xiaomi'"
      [class.text-brand-800]="brand() === 'xiaomi'"
      [class.shadow-sm]="brand() === 'xiaomi'"
      [class.text-white]="brand() !== 'xiaomi'"
      [class.opacity-70]="brand() !== 'xiaomi'"
      (click)="selectBrand('xiaomi')"
    >
      Xiaomi
    </button>
  </div>

  <div aria-label="Chọn dòng máy" class="grid grid-cols-1 gap-3 pt-1 sm:grid-cols-2 xl:grid-cols-3">
    @for (device of devices(); track device.id) {
      <button
        type="button"
        [attr.aria-pressed]="selectedDevice() === device.id"
        [disabled]="busy()"
        class="relative flex min-h-24 flex-col justify-between overflow-hidden rounded-2xl border p-3.5 text-left transition hover:border-brand-400 hover:shadow-md disabled:cursor-not-allowed disabled:opacity-50"
        [class.border-2]="selectedDevice() === device.id"
        [class.border-brand-400]="selectedDevice() === device.id"
        [class.bg-brand-50]="selectedDevice() === device.id"
        [class.shadow-md]="selectedDevice() === device.id"
        [class.border-line]="selectedDevice() !== device.id"
        [class.bg-white]="selectedDevice() !== device.id"
        (click)="selectDevice(device.id)"
      >
        @if (selectedDevice() === device.id) {
          <span aria-hidden="true" class="absolute right-2 top-2 text-brand-600">
            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6" />
            </svg>
          </span>
        }
        <span class="pr-5 font-display text-xs font-bold text-ink">{{ device.name }}</span>
        <span class="mt-1 text-[11px] text-ink-soft">{{ device.spec }}</span>
        <span class="mt-2 text-[10px] font-semibold text-ink-soft">{{ device.sub }}</span>
      </button>
    }
  </div>
</section>
