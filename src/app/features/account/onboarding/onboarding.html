<main class="onboarding-page relative isolate min-h-dvh overflow-x-hidden">
  <app-onboarding-hero [disabled]="flow.busy()" (continueRequested)="scrollToWizard()" />

  <section
    #wizardSection
    id="onboarding-form"
    aria-label="Trình thiết lập hồ sơ"
    class="relative z-10 scroll-mt-8 px-4 pb-20 sm:px-6"
  >
    <div class="mx-auto grid max-w-7xl grid-cols-1 items-start gap-8 lg:grid-cols-12 lg:gap-10">
      <div class="space-y-5 lg:col-span-7">
        <app-onboarding-stepper
          [currentStep]="state.step()"
          [disabled]="flow.busy()"
          (stepSelected)="selectStep($event)"
        />

        <div class="flex min-h-[380px] flex-col justify-between overflow-hidden rounded-3xl border border-purple-300/30 bg-onboarding-panel/90 p-5 shadow-[0_0_30px_rgba(165,140,244,0.18)] backdrop-blur-xl sm:p-6 md:p-7">
          <div #stepPanel aria-live="polite" class="min-w-0" aria-atomic="true">
            @switch (state.step()) {
              @case (1) {
                <app-step-creator-name
                  [creatorNameControl]="state.creatorNameControl"
                  [initials]="state.initials()"
                  [busy]="flow.busy()"
                />
              }
              @case (2) {
                <app-step-device
                  [brand]="state.brand()"
                  [devices]="state.devicesForBrand()"
                  [selectedDevice]="state.deviceModel()"
                  [busy]="flow.busy()"
                  (brandSelected)="state.setBrand($event)"
                  (deviceSelected)="state.selectDevice($event)"
                />
              }
              @case (3) {
                <app-step-style
                  [presets]="stylePresets"
                  [selectedStyle]="state.styleKey()"
                  [busy]="flow.busy()"
                  (styleSelected)="state.selectStyle($event)"
                />
              }
            }
          </div>

          @if (flow.errorMessage()) {
            <p class="mt-4 rounded-xl border border-rose-300/30 bg-rose-950/40 px-4 py-3 text-sm text-rose-200" role="status">
              {{ flow.errorMessage() }}
            </p>
          }

          <div class="mt-6 flex items-center justify-between gap-3 border-t border-white/10 pt-5">
            <button
              type="button"
              class="inline-flex min-h-10 items-center gap-1.5 rounded-full border border-purple-300/20 px-4 py-2.5 text-xs font-bold text-white/70 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-40"
              [disabled]="flow.busy() || state.step() === 1"
              (click)="state.prev()"
            >
              <svg aria-hidden="true" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
              </svg>
              Quay lại
            </button>

            <div class="flex items-center gap-2">
              <button
                type="button"
                class="min-h-10 rounded-full px-3 py-2 text-xs font-semibold text-white/70 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="flow.busy()"
                (click)="openSkipDialog()"
              >
                Bỏ qua
              </button>
              <button
                type="button"
                class="inline-flex min-h-10 items-center gap-1.5 rounded-full bg-gradient-to-r from-brand-600 to-brand-400 px-5 py-2.5 font-display text-xs font-bold text-white shadow-glow transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="flow.busy()"
                (click)="next()"
              >
                @if (state.isLastStep()) {
                  Hoàn tất Studio
                } @else {
                  Tiếp theo
                }
                <svg aria-hidden="true" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <aside class="lg:sticky lg:top-8 lg:col-span-5">
        <app-onboarding-preview
          [displayName]="state.creatorName()"
          [initials]="state.initials()"
          [deviceLabel]="deviceLabel()"
          [preset]="state.activePreset()"
        />
      </aside>
    </div>
  </section>

  <app-skip-dialog
    #skipDialog
    [busy]="flow.busy()"
    (skipConfirmed)="skip()"
  />
</main>
