<div class="fixed inset-0 z-[110] flex items-end justify-center sm:items-center sm:p-6">
  <button type="button" class="absolute inset-0 bg-ink/45 backdrop-blur-[2px]" aria-label="Đóng xem nhanh" tabindex="-1" (click)="closed.emit()"></button>

  <section
    #dialog
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'Xem nhanh ' + design().name"
    class="relative grid max-h-[92vh] w-full max-w-4xl overflow-y-auto rounded-t-card bg-white shadow-lift outline-none sm:grid-cols-2 sm:rounded-card"
  >
    <button type="button" (click)="closed.emit()" aria-label="Đóng" class="absolute right-3 top-3 z-10 grid size-10 place-items-center rounded-full bg-white/90 text-ink-soft shadow-soft hover:text-ink focus-visible:outline-2 focus-visible:outline-brand-400">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-5"><path d="M6 6l12 12M18 6 6 18" /></svg>
    </button>

    <!-- Media -->
    <div class="relative grid min-h-[360px] place-items-center bg-surface-container-low sm:min-h-[520px]">
      <div role="tablist" aria-label="Chế độ xem" class="absolute left-3 top-3 z-10 flex rounded-pill bg-white/90 p-1 shadow-soft">
        <button type="button" role="tab" [attr.aria-selected]="mode() === '2d'" (click)="mode.set('2d')" class="min-h-8 rounded-pill px-3 text-xs font-semibold text-ink-soft aria-selected:bg-brand-800 aria-selected:text-white">2D</button>
        <button type="button" role="tab" [attr.aria-selected]="mode() === '3d'" (click)="mode.set('3d')" class="min-h-8 rounded-pill px-3 text-xs font-semibold text-ink-soft aria-selected:bg-brand-800 aria-selected:text-white">3D · 360°</button>
      </div>
      @if (mode() === '3d') {
        <app-case-viewer-3d class="h-full w-full" [model]="model()" [artworkUrl]="artwork()" [seed]="design().id" [colorHex]="sku().colorHex" [caseType]="sku().caseType" />
      } @else {
        <app-case-preview class="w-[42%] max-w-[220px]" [model]="model()" [artworkUrl]="artwork()" [seed]="design().id" [colorHex]="sku().colorHex" [caseType]="sku().caseType" />
      }
    </div>

    <!-- Info -->
    <div class="flex flex-col gap-5 p-6 sm:p-8">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-brand-600">{{ design().collection }}</p>
        <h2 class="mt-1 font-display text-2xl font-bold text-ink">{{ design().name }}</h2>
        <p class="mt-1 text-sm text-ink-soft">{{ model().name }}</p>
        <p class="mt-3 text-xl font-bold text-ink">{{ vnd(price()) }}</p>
      </div>

      <app-variant-picker [model]="model()" [sku]="sku()" (skuChange)="sku.set($event)" />

      <p class="text-sm" [class.text-success]="stock()" [class.text-danger]="!stock()">
        {{ stock() ? 'Còn hàng · giao trong 2–4 ngày' : 'Tạm hết hàng' }}
      </p>

      <div class="mt-auto grid gap-2">
        <button
          type="button"
          [disabled]="!stock()"
          (click)="add($event)"
          class="min-h-12 rounded-pill bg-brand-800 text-sm font-semibold text-white shadow-soft hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-400"
        >
          Thêm vào giỏ · {{ vnd(price()) }}
        </button>
        <a
          [routerLink]="['/shop', design().id]"
          [queryParams]="{ model: model().id, sku: sku().skuId }"
          (click)="closed.emit()"
          class="grid min-h-12 place-items-center rounded-pill border border-line text-sm font-semibold text-ink hover:bg-surface-container-low focus-visible:outline-2 focus-visible:outline-brand-400"
        >
          Xem chi tiết sản phẩm
        </a>
      </div>
    </div>
  </section>
</div>
