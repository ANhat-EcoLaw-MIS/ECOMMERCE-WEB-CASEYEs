<div class="checkout-page">
  <!-- Toast notification -->
  @if (toastMessage()) {
    <div class="toast-notification" role="status" aria-live="polite">
      <span class="material-symbols-outlined toast-icon">check_circle</span>
      <span>{{ toastMessage() }}</span>
    </div>
  }

  <!-- Dynamic Checkout View Container -->
  <main class="checkout-container">
    @switch (currentStep()) {
      @case ('form') {
        <app-checkout-form
          (openAddressModal)="showAddressModal.set(true)"
          (orderSubmitted)="onOrderSubmitted()"
          (copyNotification)="showToast($event)"
        />
      }
      @case ('processing') {
        <app-checkout-processing
          [simulationMode]="simulationMode()"
          (backToForm)="setStep('form')"
          (reconciliationDone)="onReconciliationDone($event)"
          (copyNotification)="showToast($event)"
        />
      }
      @case ('success') {
        <app-checkout-success
          (newOrder)="onNewOrder()"
          (copyNotification)="showToast($event)"
        />
      }
      @case ('failed') {
        <app-checkout-failed
          #failedComp
          (retry)="onRetryFromFailed()"
          (editOrder)="setStep('form')"
          (copyNotification)="showToast($event)"
        />
      }
    }
  </main>

  <!-- Modal đổi địa chỉ nhận hàng (6 trường validated) -->
  @if (showAddressModal()) {
    <app-address-modal
      (close)="showAddressModal.set(false)"
      (addressSaved)="showToast($event)"
    />
  }

  <!-- Floating Dev & Demo Dock (Nút icon tối giản góc phải dưới, popover ẩn mặc định) -->
  <app-dev-dock
    [currentStep]="currentStep()"
    [simulationMode]="simulationMode()"
    (stepChange)="setStep($event)"
    (modeChange)="simulationMode.set($event)"
    (forceOutcome)="onForceOutcome($event)"
    (expireTimer)="onExpireTimer()"
  />
</div>
