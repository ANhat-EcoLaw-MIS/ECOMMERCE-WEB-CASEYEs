<button
  type="button"
  (click)="open.set(!open())"
  [attr.aria-expanded]="open()"
  aria-controls="ot-notifications"
  [attr.aria-label]="inbox.unreadCount() ? 'Thông báo, ' + inbox.unreadCount() + ' chưa đọc' : 'Thông báo'"
  class="relative grid size-11 place-items-center rounded-full border border-line bg-surface text-ink transition-colors hover:border-brand-400 hover:text-brand-800 focus-visible:outline-2 focus-visible:outline-brand-400"
>
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5">
    <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
  </svg>
  @if (inbox.unreadCount() > 0) {
    <span aria-hidden="true" class="absolute -right-0.5 -top-0.5 grid h-5 min-w-5 place-items-center rounded-full px-1 text-[11px] font-bold" [class]="dot">
      {{ inbox.unreadCount() > 9 ? '9+' : inbox.unreadCount() }}
    </span>
  }
</button>

@if (open()) {
  <div id="ot-notifications" role="dialog" aria-label="Thông báo đơn hàng"
    class="absolute right-0 top-full z-40 mt-2 w-[min(92vw,22rem)] overflow-hidden rounded-card border border-line bg-surface-alt shadow-lift">
    <div class="flex items-center justify-between border-b border-line px-4 py-3">
      <p class="font-display font-bold text-ink">Thông báo</p>
      @if (inbox.unreadCount() > 0) {
        <button type="button" (click)="inbox.markAllRead()" class="min-h-9 text-xs font-semibold text-brand-800 hover:underline">Đánh dấu đã đọc</button>
      }
    </div>
    <ul class="max-h-96 overflow-y-auto">
      @for (m of inbox.messages(); track m.id) {
        <li>
          <button type="button" (click)="openMessage(m)" class="flex w-full gap-3 px-4 py-3 text-left transition-colors hover:bg-brand-50 focus-visible:bg-brand-50">
            <span aria-hidden="true" class="mt-1.5 size-2 shrink-0 rounded-full" [class.bg-brand-600]="!inbox.isRead(m.id)" [class.bg-transparent]="inbox.isRead(m.id)"></span>
            <span class="min-w-0">
              <span class="block text-sm text-ink" [class.font-semibold]="!inbox.isRead(m.id)">{{ m.title }}</span>
              <span class="line-clamp-2 block text-xs text-ink-soft">{{ m.body }}</span>
              <span class="block text-[11px] text-ink-soft">{{ ago(m.createdAt) }}</span>
            </span>
          </button>
        </li>
      } @empty {
        <li class="px-4 py-6 text-center text-sm text-ink-soft">Chưa có thông báo.</li>
      }
    </ul>
  </div>
}
